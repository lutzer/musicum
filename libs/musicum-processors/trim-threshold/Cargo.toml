[package]
name = "trim-threshold"
version = "0.1.0"
edition = "2021"
description = "trim-threshold processor for Musicum"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
musicum-processor-sdk = { path = "../../musicum-processor-sdk" }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
typetag     = "0.2"
